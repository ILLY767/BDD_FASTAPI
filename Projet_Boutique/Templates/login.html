{% extends "base.html" %}

{% block title %}
    Connexion
{% endblock %}

{% block content %}

<!-- =====================================================
     PAGE DE CONNEXION
     ===================================================== -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body">

                    <!-- Titre de la page -->
                    <h2 class="text-center mb-4">
                        Connexion
                    </h2>

                    <!--
                    Si une erreur est envoyée par Flask,
                    elle sera affichée ici.
                    -->
                    {% if erreur %}
                        <div class="alert alert-danger">
                            {{ erreur }}
                        </div>
                    {% endif %}

                    <!-- =================================================
                         FORMULAIRE
                         ================================================= -->

                    <form method="POST"
                          action="{{ url_for('login') }}">

                        <!-- Email -->
                        <div class="mb-3">

                            <label for="email"
                                   class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                required
                            >

                        </div>

                        <!-- Mot de passe -->
                        <div class="mb-3">

                            <label for="mot_de_passe"
                                   class="form-label">
                                Mot de passe
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="mot_de_passe"
                                name="mot_de_passe"
                                required
                            >

                        </div>

                        <!-- Bouton de connexion -->
                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-primary">
                                Se connecter
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
